version: '3.8'

services:
  acsrag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acsrag_container
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - GOOGLE_API_KEY=
      - TAVILY_API_KEY=
    restart: unless-stopped
    volumes:
      - ./documents:/app/documents
